[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dipankar Biswas", email = "dipankarbd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.1",
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "neo4j>=6.4.1",
    "pydantic>=2.14.3",
    "sse-starlette>=3.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
agents = "agents:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
