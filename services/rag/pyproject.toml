[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Dipankar Biswas", email = "dipankarbd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastmcp>=4.1.6",
    "pydantic>=2.14.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag:main"
ingest-seed = "rag.server:ingest_seed_cli"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
